name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Playwright (against a real backend)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      # Backend
      MONGO_URI: mongodb://localhost:27017/ongoingrec
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ongoingrec
      S3_SECRET_KEY: ongoingrec-dev-only
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_RAW: pw-ongoingrec-raw
      S3_BUCKET_DERIVED: pw-ongoingrec-derived
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      CRM_ADAPTER: mock
      DISABLE_SCHEDULED_JOBS: 'true'
      SEED_PASSWORD: ChangeMe-Local-Dev-1
      # Console
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
      CONSOLE_URL: http://localhost:3001

    steps:
      - name: Check out the console
        uses: actions/checkout@v4
        with:
          path: console

      # The suite deliberately runs against the real backend with seeded data.
      # A console verified against mocks proves nothing about whether coverage
      # is actually being reported.
      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pw-ongoingrec-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Start MinIO
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ongoingrec \
            -e MINIO_ROOT_PASSWORD=ongoingrec-dev-only \
            minio/minio:latest server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live >/dev/null && exit 0
            sleep 1
          done
          echo "::error::MinIO did not become ready"; docker logs minio; exit 1

      - name: Build, seed and start the backend
        working-directory: backend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run seed
          npm run derive -- 7
          npm run reconcile -- 7
          npm run start:prod &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Backend did not become ready"; exit 1

      - name: Build and start the console
        working-directory: console
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/login >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Console did not become ready"; exit 1

      - name: Run Playwright
        working-directory: console
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: console/playwright-report/
          retention-days: 7
