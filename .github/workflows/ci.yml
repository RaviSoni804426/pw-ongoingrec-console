name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Playwright (against the real backend image)
    runs-on: ubuntu-latest

    # GITHUB_TOKEN can read packages in the same account, so no cross-repo PAT
    # is needed. See README, "How the end-to-end job reaches the backend".
    permissions:
      contents: read
      packages: read

    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
      CONSOLE_URL: http://localhost:3001
      SEED_PASSWORD: ChangeMe-Local-Dev-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # GHCR rejects uppercase in repository names and the account has capitals.
      - name: Compute the backend image name
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/$owner/pw-ongoingrec-backend:main" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A permanently-skipping test is a test that does not exist. On main the
      # image must be there; only a fork PR — which genuinely cannot read GHCR
      # packages — is allowed to skip.
      - name: Ensure the backend image is available
        id: image
        run: |
          set -uo pipefail
          if docker pull "$BACKEND_IMAGE"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "::notice::Fork pull request cannot read GHCR packages; the end-to-end job is skipped."
            exit 0
          fi

          echo "::error::$BACKEND_IMAGE could not be pulled. Push pw-ongoingrec-backend to main so its CI publishes the image."
          exit 1

      # An env file rather than an inline string of -e flags: the latter only
      # works if the shell word-splits it, which is a needless dependency on
      # the runner's shell behaving like bash.
      - name: Write the backend environment
        if: steps.image.outputs.available == 'true'
        run: |
          cat > backend.env <<'ENVFILE'
          MONGO_URI=mongodb://localhost:27017/ongoingrec
          REDIS_HOST=127.0.0.1
          S3_ENDPOINT=http://localhost:9000
          S3_ACCESS_KEY=ongoingrec
          S3_SECRET_KEY=ongoingrec-dev-only
          S3_FORCE_PATH_STYLE=true
          JWT_SECRET=ci-only-secret-not-used-anywhere-else
          CRM_ADAPTER=mock
          DISABLE_SCHEDULED_JOBS=true
          SEED_PASSWORD=ChangeMe-Local-Dev-1
          ENVFILE
          sed -i 's/^[[:space:]]*//' backend.env

      - name: Start MinIO
        if: steps.image.outputs.available == 'true'
        run: |
          set -euo pipefail
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=ongoingrec \
            -e MINIO_ROOT_PASSWORD=ongoingrec-dev-only \
            minio/minio:latest server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live >/dev/null && exit 0
            sleep 1
          done
          echo "::error::MinIO did not become ready"; docker logs minio; exit 1

      # --network host so the container reaches the service containers on
      # localhost, exactly as the app expects in development.
      - name: Seed, derive and reconcile inside the backend image
        if: steps.image.outputs.available == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network host --env-file backend.env \
            --entrypoint node "$BACKEND_IMAGE" dist/seed/seed.js
          docker run --rm --network host --env-file backend.env \
            --entrypoint node "$BACKEND_IMAGE" dist/seed/derive-now.js 7
          docker run --rm --network host --env-file backend.env \
            --entrypoint node "$BACKEND_IMAGE" dist/seed/reconcile-now.js 7

      - name: Start the backend
        if: steps.image.outputs.available == 'true'
        run: |
          set -euo pipefail
          docker run -d --name backend --network host --env-file backend.env "$BACKEND_IMAGE"
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Backend did not become ready"; docker logs backend; exit 1

      - name: Build and start the console
        if: steps.image.outputs.available == 'true'
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/login >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Console did not become ready"; exit 1

      - name: Run Playwright
        if: steps.image.outputs.available == 'true'
        run: npm run test:e2e

      - name: Backend logs on failure
        if: failure()
        run: docker logs backend || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole point is scanning history, not just the tip.
          fetch-depth: 0

      - name: Scan working tree and full history for secrets
        env:
          PW_LEAKED_SECRET: ${{ secrets.PW_LEAKED_SECRET }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: bash .github/scripts/secret-scan.sh
